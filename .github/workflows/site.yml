name: Deploy site

# A push to main builds and publishes the site. Every pull request builds it
# without publishing: `build` is a required check on main, so a change that
# breaks the site — a dependency bump or a knowledge edit — cannot merge.
on:
  push:
    branches: [main]
    # The site renders the feed and two knowledge domains at build time.
    paths:
      - 'seed/site/**'
      - 'seed/feed/**'
      - 'knowledge/exobrain/**'
      - 'knowledge/harness-engineering/**'
      - '.github/workflows/site.yml'
  # No path filter: a required check has to report on every pull request.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue behind each other; a pull request's newer push cancels its
# older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seed/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: seed/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
