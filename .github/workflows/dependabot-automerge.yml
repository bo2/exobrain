name: Dependabot auto-merge

# Turns on auto-merge for each Dependabot pull request that is not a
# semver-major bump; branch protection holds the merge until the required
# `build` check passes. Major bumps stay open for a person.
#
# The merge runs as GITHUB_TOKEN, so it triggers no workflow: the site is not
# redeployed for a dependency bump. Its next content change publishes the
# rebuilt site, and the bump only touches build tooling — visitors get static
# pages either way.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # The actor check keeps a person's push to a Dependabot branch from
    # auto-merging it.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
